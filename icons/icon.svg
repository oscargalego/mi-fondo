<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1a1d2a"/>
      <stop offset="1" stop-color="#07070c"/>
    </radialGradient>
    <linearGradient id="lineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5a0" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00e5a0"/>
    </linearGradient>
    <linearGradient id="lineO" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ffd25a"/>
    </linearGradient>
    <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5a0" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#00e5a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="areaO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa21a" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#ffa21a" stop-opacity="0"/>
    </linearGradient>
    <!-- Silver coin -->
    <linearGradient id="silverEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="0.45" stop-color="#9aa1ad"/>
      <stop offset="1" stop-color="#4a505b"/>
    </linearGradient>
    <radialGradient id="silverFace" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#7b818c"/>
      <stop offset="0.6" stop-color="#3a3f48"/>
      <stop offset="1" stop-color="#22252c"/>
    </radialGradient>
    <!-- Gold coin -->
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f7931a"/>
      <stop offset="1" stop-color="#a85a05"/>
    </linearGradient>
    <radialGradient id="goldFace" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#ffc24a"/>
      <stop offset="0.6" stop-color="#f7931a"/>
      <stop offset="1" stop-color="#c46a08"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background (full bleed, the OS applies its own mask) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Charts -->
  <path d="M0 250 L30 244 L56 236 L86 222 L108 230 L132 196 L152 206 L176 168 L198 182 L222 150 L246 176 L246 512 L0 512 Z" fill="url(#areaG)"/>
  <polyline points="0,250 30,244 56,236 86,222 108,230 132,196 152,206 176,168 198,182 222,150 246,176" fill="none" stroke="url(#lineG)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M246 176 L270 186 L292 150 L314 162 L338 118 L360 132 L384 96 L408 104 L432 70 L456 76 L484 60 L512 52 L512 512 L246 512 Z" fill="url(#areaO)"/>
  <polyline points="246,176 270,186 292,150 314,162 338,118 360,132 384,96 408,104 432,70 456,76 484,60 512,52" fill="none" stroke="url(#lineO)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Silver S&P 500 coin -->
  <g filter="url(#shadow)">
    <circle cx="170" cy="318" r="104" fill="url(#silverEdge)"/>
    <circle cx="170" cy="318" r="90" fill="url(#silverFace)"/>
    <circle cx="170" cy="318" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <text x="170" y="306" text-anchor="middle" font-family="Inter" font-weight="800" font-size="52" fill="#f2f4f8">S&amp;P</text>
    <text x="170" y="360" text-anchor="middle" font-family="Inter" font-weight="800" font-size="52" fill="#f2f4f8">500</text>
  </g>

  <!-- Gold Bitcoin coin -->
  <g filter="url(#shadow)">
    <circle cx="342" cy="318" r="104" fill="url(#goldEdge)"/>
    <circle cx="342" cy="318" r="90" fill="url(#goldFace)"/>
    <circle cx="342" cy="318" r="90" fill="none" stroke="#fff3c4" stroke-opacity="0.35" stroke-width="2"/>
    <g transform="rotate(14 342 318)" fill="#ffffff">
      <rect x="326" y="252" width="9" height="22" rx="2"/>
      <rect x="344" y="252" width="9" height="22" rx="2"/>
      <rect x="326" y="362" width="9" height="22" rx="2"/>
      <rect x="344" y="362" width="9" height="22" rx="2"/>
      <text x="342" y="356" text-anchor="middle" font-family="Inter" font-weight="800" font-size="110">B</text>
    </g>
  </g>
</svg>
